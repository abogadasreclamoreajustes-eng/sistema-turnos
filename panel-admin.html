<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de turnos - Gestión interna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --lila: #C4B5D5;
      --violeta: #4b2e83;
      --negro: #1a1a1a;
      --blanco: #ffffff;
      --gris: #6b6b6b;
      --verde: #3f8f5f;
      --rojo: #b03434;
      --ambar-bg: #FBF1D6;
      --ambar-borde: #E3C878;
      --ambar-texto: #8A6A1F;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Red Hat Display', Arial, sans-serif;
      background: #f7f6fa;
      color: var(--negro);
      margin: 0;
      padding: 28px 16px 60px;
    }
    .contenedor { max-width: 720px; margin: 0 auto; }
    .encabezado {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 24px;
    }
    h1 { font-size: 20px; font-weight: 700; color: var(--violeta); margin: 0 0 4px 0; }
    p.sub { color: var(--gris); font-size: 13px; margin: 0; }
    button.actualizar {
      background: var(--blanco);
      border: 1px solid rgba(75,46,131,0.25);
      color: var(--violeta);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
      flex-shrink: 0;
    }
    button.actualizar:hover { background: rgba(75,46,131,0.06); }

    .seccion { margin-top: 36px; }
    .seccion-titulo {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--gris);
      margin: 0 0 14px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .seccion-titulo.entregas { color: var(--ambar-texto); }

    .turno-card {
      background: var(--blanco);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .entrega-card { border: 1px solid var(--ambar-borde); background: #FFFCF5; }
    .turno-info { flex: 1; min-width: 220px; }
    .turno-fecha { font-weight: 700; font-size: 14px; color: var(--negro); }
    .turno-detalle { font-size: 13px; color: var(--gris); margin-top: 4px; line-height: 1.5; }
    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      margin-left: 8px;
      vertical-align: middle;
    }
    .badge-reservado { background: rgba(196,181,213,0.4); color: var(--violeta); }
    .badge-confirmada { background: rgba(63,143,95,0.15); color: var(--verde); }
    .badge-pendiente { background: rgba(227,200,120,0.35); color: var(--ambar-texto); }
    .badge-realizada { background: rgba(63,143,95,0.15); color: var(--verde); }
    .badge-norealizada { background: rgba(176,52,52,0.12); color: var(--rojo); }
    .acciones { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }
    button.btn { font-family: inherit; font-size: 12.5px; font-weight: 600; border-radius: 8px; padding: 9px 14px; border: none; cursor: pointer; white-space: nowrap; }
    .btn-confirmar { background: var(--violeta); color: var(--blanco); }
    .btn-confirmar:disabled { opacity: 0.5; cursor: default; }
    .btn-liberar { background: var(--blanco); color: var(--rojo); border: 1px solid rgba(176,52,52,0.3); }
    .btn-ambar { background: var(--blanco); color: var(--ambar-texto); border: 1px solid var(--ambar-borde); }
    .btn-ambar-lleno { background: var(--ambar-texto); color: var(--blanco); }
    .btn-chico { padding: 7px 10px; font-size: 11.5px; }
    .cargando, .vacio { text-align: center; color: var(--gris); padding: 32px 0; font-size: 14px; }
    .error-acceso { text-align: center; color: var(--rojo); padding: 60px 20px; font-size: 14px; }

    .form-agregar {
      background: var(--blanco);
      border: 1px dashed var(--ambar-borde);
      border-radius: 12px;
      padding: 16px 18px;
      margin-bottom: 12px;
      display: none;
    }
    .form-agregar.visible { display: block; }
    .form-agregar label { display: block; font-size: 12px; font-weight: 600; color: var(--gris); margin: 10px 0 4px; }
    .form-agregar input, .form-agregar select {
      width: 100%;
      font-family: inherit;
      font-size: 13.5px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.15);
    }
    .form-agregar .fila-botones { margin-top: 14px; display: flex; gap: 8px; }

    .editar-motivo-fila { display: flex; gap: 8px; align-items: center; margin-top: 6px; flex-wrap: wrap; }
    .editar-motivo-fila select { font-family: inherit; font-size: 13px; padding: 6px 8px; border-radius: 6px; border: 1px solid rgba(0,0,0,0.15); }
  </style>
</head>
<body>
  <div class="contenedor">
    <div class="encabezado">
      <div>
        <h1>Turnos presenciales · Rosario</h1>
        <p class="sub">Marcá los turnos confirmados, liberá los que se cancelen y gestioná las entregas sin turno.</p>
      </div>
      <button class="actualizar" onclick="cargarTodo()">↻ Actualizar</button>
    </div>

    <div class="seccion">
      <p class="seccion-titulo">Consultas con turno</p>
      <div id="lista">
        <p class="cargando">Cargando turnos...</p>
      </div>
    </div>

    <div class="seccion">
      <p class="seccion-titulo entregas">
        <span>Entregas sin turno</span>
        <button class="btn btn-ambar btn-chico" onclick="toggleFormAgregar()">+ Agregar entrega</button>
      </p>

      <div class="form-agregar" id="form-agregar">
        <label>Miércoles</label>
        <select id="entrega-fecha"></select>
        <label>Nombre</label>
        <input type="text" id="entrega-nombre" placeholder="Nombre de la persona">
        <label>Teléfono (opcional)</label>
        <input type="text" id="entrega-telefono" placeholder="Teléfono">
        <label>Motivo</label>
        <select id="entrega-motivo"></select>
        <div class="fila-botones">
          <button class="btn btn-ambar-lleno" onclick="agregarEntrega()">Guardar</button>
          <button class="btn btn-liberar" onclick="toggleFormAgregar()">Cancelar</button>
        </div>
      </div>

      <div id="lista-entregas">
        <p class="cargando">Cargando entregas...</p>
      </div>
    </div>
  </div>

  <script>
    // Página estática (GitHub Pages) -- ya no depende de que el navegador
    // "abra" nada dentro de Google (eso era lo que fallaba con la cuenta de
    // Evelyn: Google Drive intentaba resolver el archivo del proyecto de
    // Apps Script bajo la cuenta activa del navegador y a veces no podía).
    // Acá solo se hacen llamadas fetch() de fondo al mismo backend, igual
    // que ya hace la página pública de turnos -- eso nunca falló.
    const BASE_URL = 'https://script.google.com/macros/s/AKfycbzRjhskoznfYXFZ8sqXsyF7l9f2cE0e8QMfJa6zj8X8R5ZWpFlRtzmy9mBmfQmiSrDPQA/exec';
    const TOKEN = '03f0fa645faa4c9a95e05a44';
    // Leer listas es una simple lectura de planilla: rápido, así que vale
    // la pena reintentar seguido con un timeout corto.
    const TIMEOUT_MS = 8000;
    const MAX_INTENTOS = 6;
    // Confirmar/Liberar/agregar-entrega además tocan Calendar o son
    // acciones que no queremos duplicar por reintentos agresivos: más
    // margen de tiempo por intento, pero menos intentos. El backend es
    // idempotente para las que tocan Calendar, así que reintentar sigue
    // siendo seguro si hiciera falta.
    const WRITE_TIMEOUT_MS = 45000;
    const WRITE_MAX_INTENTOS = 2;

    function esperar_(ms) { return new Promise((resolve) => setTimeout(resolve, ms)); }

    async function fetchConTimeout(url, options, timeoutMs) {
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: controller.signal });
      } finally {
        clearTimeout(timer);
      }
    }

    async function fetchConReintentos_(url, options, config) {
      const timeoutMs = (config && config.timeoutMs) || TIMEOUT_MS;
      const maxIntentos = (config && config.maxIntentos) || MAX_INTENTOS;
      let ultimoError;
      for (let intento = 0; intento < maxIntentos; intento++) {
        try {
          const res = await fetchConTimeout(url, options, timeoutMs);
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return await res.json();
        } catch (err) {
          ultimoError = err;
          if (intento < maxIntentos - 1) await esperar_(300);
        }
      }
      throw ultimoError;
    }

    function cargarTodo() {
      cargar();
      cargarEntregas();
    }

    // --- Consultas con turno ---

    function cargar() {
      document.getElementById('lista').innerHTML = '<p class="cargando">Cargando turnos...</p>';
      fetchConReintentos_(`${BASE_URL}?api=admin_list&token=${encodeURIComponent(TOKEN)}`)
        .then(mostrar)
        .catch(mostrarError);
    }

    function mostrar(resultado) {
      const lista = document.getElementById('lista');
      if (!resultado.ok) {
        lista.innerHTML = '<p class="error-acceso">' + (resultado.message || 'Acceso no autorizado.') + '</p>';
        return;
      }
      if (!resultado.reservas.length) {
        lista.innerHTML = '<p class="vacio">No hay turnos próximos por confirmar.</p>';
        return;
      }
      lista.innerHTML = '';
      resultado.reservas.forEach(function (r) {
        const card = document.createElement('div');
        card.className = 'turno-card';

        const info = document.createElement('div');
        info.className = 'turno-info';
        const badgeClass = r.estado === 'Confirmada' ? 'badge-confirmada' : 'badge-reservado';
        info.innerHTML =
          '<span class="turno-fecha">' + r.fecha + ' · ' + r.hora + ' hs' +
          '<span class="badge ' + badgeClass + '">' + r.estado + '</span></span>' +
          '<div class="turno-detalle">' + r.cliente + ' · ' + r.telefono + '<br>' +
          r.motivo + ' · Atiende: ' + r.abogada + '</div>';
        card.appendChild(info);

        const acciones = document.createElement('div');
        acciones.className = 'acciones';

        const btnConfirmar = document.createElement('button');
        btnConfirmar.className = 'btn btn-confirmar';
        btnConfirmar.textContent = r.estado === 'Confirmada' ? 'Confirmada ✓' : 'Confirmar';
        btnConfirmar.disabled = r.estado === 'Confirmada';
        btnConfirmar.onclick = function () { confirmar(r.eventId, btnConfirmar); };
        acciones.appendChild(btnConfirmar);

        const btnLiberar = document.createElement('button');
        btnLiberar.className = 'btn btn-liberar';
        btnLiberar.textContent = 'Liberar turno';
        btnLiberar.onclick = function () { liberar(r.eventId, r.cliente, btnLiberar); };
        acciones.appendChild(btnLiberar);

        card.appendChild(acciones);
        lista.appendChild(card);
      });
    }

    function confirmar(eventId, btn) {
      btn.disabled = true;
      btn.textContent = 'Guardando...';
      fetchConReintentos_(`${BASE_URL}?api=admin_confirm`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ eventId, token: TOKEN })
      }, { timeoutMs: WRITE_TIMEOUT_MS, maxIntentos: WRITE_MAX_INTENTOS })
        .then(function () { cargar(); })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Confirmar';
          alert('No se pudo confirmar. Probá de nuevo -- si ya lo habías confirmado antes, puede que sí se haya guardado: actualizá la lista para revisar.');
        });
    }

    function liberar(eventId, nombre, btn) {
      if (!confirm('¿Liberar el turno de ' + nombre + '? El horario vuelve a quedar disponible y se avisa al cliente por email.')) return;
      btn.disabled = true;
      btn.textContent = 'Liberando...';
      fetchConReintentos_(`${BASE_URL}?api=admin_free`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ eventId, token: TOKEN })
      }, { timeoutMs: WRITE_TIMEOUT_MS, maxIntentos: WRITE_MAX_INTENTOS })
        .then(function () { cargar(); })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Liberar turno';
          alert('No se pudo liberar el turno -- si ya lo habías liberado antes, puede que sí se haya guardado: actualizá la lista para revisar. Si sigue apareciendo acá, probá de nuevo.');
        });
    }

    function mostrarError() {
      document.getElementById('lista').innerHTML = '<p class="error-acceso">Ocurrió un error al cargar los turnos. Recargá la página.</p>';
    }

    // --- Entregas sin turno ---

    const MOTIVOS_ENTREGA = [
      'Entregar documentación',
      'Retirar documentación',
      'Entregar formularios',
      'Retirar formularios',
      'Realizar un pago',
      'Entregar dinero',
      'Otra gestión breve'
    ];

    function llenarSelectMotivos_(select, seleccionado) {
      select.innerHTML = '';
      MOTIVOS_ENTREGA.forEach(function (m) {
        const opt = document.createElement('option');
        opt.value = m;
        opt.textContent = m;
        if (m === seleccionado) opt.selected = true;
        select.appendChild(opt);
      });
    }

    function proximosMiercoles_(cantidad) {
      const fechas = [];
      const hoy = new Date();
      const base = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
      for (let d = new Date(base); fechas.length < cantidad; d.setDate(d.getDate() + 1)) {
        if (d.getDay() === 3) { // 3 = miércoles
          fechas.push(new Date(d));
        }
      }
      return fechas;
    }

    function formatearFechaISO_(d) {
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function formatearFechaLegible_(d) {
      return d.toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    }

    function toggleFormAgregar() {
      const form = document.getElementById('form-agregar');
      const yaVisible = form.classList.contains('visible');
      if (!yaVisible) {
        const selectFecha = document.getElementById('entrega-fecha');
        selectFecha.innerHTML = '';
        proximosMiercoles_(8).forEach(function (d) {
          const opt = document.createElement('option');
          opt.value = formatearFechaISO_(d);
          opt.textContent = formatearFechaLegible_(d);
          selectFecha.appendChild(opt);
        });
        llenarSelectMotivos_(document.getElementById('entrega-motivo'));
        document.getElementById('entrega-nombre').value = '';
        document.getElementById('entrega-telefono').value = '';
      }
      form.classList.toggle('visible', !yaVisible);
    }

    function agregarEntrega() {
      const fecha = document.getElementById('entrega-fecha').value;
      const nombre = document.getElementById('entrega-nombre').value.trim();
      const telefono = document.getElementById('entrega-telefono').value.trim();
      const motivo = document.getElementById('entrega-motivo').value;
      if (!nombre) { alert('Falta el nombre.'); return; }

      fetchConReintentos_(`${BASE_URL}?api=admin_entrega_add`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ fecha, nombre, telefono, motivo, token: TOKEN })
      }, { timeoutMs: WRITE_TIMEOUT_MS, maxIntentos: WRITE_MAX_INTENTOS })
        .then(function () {
          toggleFormAgregar();
          cargarEntregas();
        })
        .catch(function () {
          alert('No se pudo agregar la entrega. Probá de nuevo.');
        });
    }

    function cargarEntregas() {
      document.getElementById('lista-entregas').innerHTML = '<p class="cargando">Cargando entregas...</p>';
      fetchConReintentos_(`${BASE_URL}?api=admin_entregas_list&token=${encodeURIComponent(TOKEN)}`)
        .then(mostrarEntregas)
        .catch(function () {
          document.getElementById('lista-entregas').innerHTML = '<p class="error-acceso">Ocurrió un error al cargar las entregas. Recargá la página.</p>';
        });
    }

    function badgeEntregaClase_(estado) {
      if (estado === 'Realizada') return 'badge-realizada';
      if (estado === 'No realizada') return 'badge-norealizada';
      return 'badge-pendiente';
    }

    function mostrarEntregas(resultado) {
      const lista = document.getElementById('lista-entregas');
      if (!resultado.ok) {
        lista.innerHTML = '<p class="error-acceso">' + (resultado.message || 'Acceso no autorizado.') + '</p>';
        return;
      }
      if (!resultado.entregas.length) {
        lista.innerHTML = '<p class="vacio">No hay entregas sin turno registradas.</p>';
        return;
      }
      lista.innerHTML = '';
      resultado.entregas.forEach(function (e) {
        const card = document.createElement('div');
        card.className = 'turno-card entrega-card';

        const info = document.createElement('div');
        info.className = 'turno-info';
        info.innerHTML =
          '<span class="turno-fecha">' + e.fecha + ' · ' + e.franja +
          '<span class="badge ' + badgeEntregaClase_(e.estado) + '">' + e.estado + '</span></span>' +
          '<div class="turno-detalle">' + e.nombre + (e.telefono ? ' · ' + e.telefono : '') + '<br>' +
          '<span class="motivo-texto">' + e.motivo + '</span></div>';
        card.appendChild(info);

        const acciones = document.createElement('div');
        acciones.className = 'acciones';

        const btnEditar = document.createElement('button');
        btnEditar.className = 'btn btn-ambar btn-chico';
        btnEditar.textContent = 'Editar motivo';
        btnEditar.onclick = function () { mostrarEditorMotivo_(e, info, acciones); };
        acciones.appendChild(btnEditar);

        const btnRealizada = document.createElement('button');
        btnRealizada.className = 'btn btn-ambar-lleno btn-chico';
        btnRealizada.textContent = 'Marcar realizada';
        btnRealizada.onclick = function () { marcarEntrega(e.id, 'Realizada', btnRealizada); };
        acciones.appendChild(btnRealizada);

        const btnNoRealizada = document.createElement('button');
        btnNoRealizada.className = 'btn btn-ambar btn-chico';
        btnNoRealizada.textContent = 'No realizada';
        btnNoRealizada.onclick = function () { marcarEntrega(e.id, 'No realizada', btnNoRealizada); };
        acciones.appendChild(btnNoRealizada);

        const btnCancelar = document.createElement('button');
        btnCancelar.className = 'btn btn-liberar btn-chico';
        btnCancelar.textContent = 'Cancelar';
        btnCancelar.onclick = function () {
          if (!confirm('¿Cancelar la entrega de ' + e.nombre + '?')) return;
          marcarEntrega(e.id, 'Cancelada', btnCancelar);
        };
        acciones.appendChild(btnCancelar);

        card.appendChild(acciones);
        lista.appendChild(card);
      });
    }

    function mostrarEditorMotivo_(entrega, info, acciones) {
      const fila = document.createElement('div');
      fila.className = 'editar-motivo-fila';
      const select = document.createElement('select');
      llenarSelectMotivos_(select, entrega.motivo);
      const btnGuardar = document.createElement('button');
      btnGuardar.className = 'btn btn-ambar-lleno btn-chico';
      btnGuardar.textContent = 'Guardar';
      btnGuardar.onclick = function () {
        btnGuardar.disabled = true;
        btnGuardar.textContent = 'Guardando...';
        fetchConReintentos_(`${BASE_URL}?api=admin_entrega_motivo`, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ id: entrega.id, motivo: select.value, token: TOKEN })
        }, { timeoutMs: WRITE_TIMEOUT_MS, maxIntentos: WRITE_MAX_INTENTOS })
          .then(function () { cargarEntregas(); })
          .catch(function () {
            alert('No se pudo guardar el motivo. Probá de nuevo.');
            btnGuardar.disabled = false;
            btnGuardar.textContent = 'Guardar';
          });
      };
      fila.appendChild(select);
      fila.appendChild(btnGuardar);
      info.appendChild(fila);
    }

    function marcarEntrega(id, estado, btn) {
      btn.disabled = true;
      const textoOriginal = btn.textContent;
      btn.textContent = 'Guardando...';
      fetchConReintentos_(`${BASE_URL}?api=admin_entrega_estado`, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ id, estado, token: TOKEN })
      }, { timeoutMs: WRITE_TIMEOUT_MS, maxIntentos: WRITE_MAX_INTENTOS })
        .then(function () { cargarEntregas(); })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = textoOriginal;
          alert('No se pudo guardar el cambio. Probá de nuevo -- si ya se había aplicado, puede que sí se haya guardado: actualizá la lista para revisar.');
        });
    }

    cargarTodo();
  </script>
</body>
</html>
